<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>C4-06 別の画像に切り替える</title>

</head>
<body>
	<h1>別の画像に切り替える</h1>

  <h2>ホバーして画像を変更する</h2>
  <div class="img-container">
    <img class="img-change" src="https://images.unsplash.com/photo-1604451974794-5fd2eaa47810?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3wzMjM4NDZ8MHwxfHJhbmRvbXx8fHx8fHx8fDE3MzU0NTU2MTZ8&ixlib=rb-4.0.3&q=80&w=400" alt="">
  </div>

  <h2>サムネイル画像を大きく表示</h2>
  <div class="gallery">
    <div class="gallery-main">
      <img src="https://images.unsplash.com/photo-1528825871115-3581a5387919?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3wzMjM4NDZ8MHwxfHJhbmRvbXx8fHx8fHx8fDE3MzU0NTYzODZ8&ixlib=rb-4.0.3&q=80&w=400" alt="">
    </div>
    <ul class="gallery-thumbnail">
      <li>
        <img src="https://images.unsplash.com/photo-1528825871115-3581a5387919?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3wzMjM4NDZ8MHwxfHJhbmRvbXx8fHx8fHx8fDE3MzU0NTYzODZ8&ixlib=rb-4.0.3&q=80&w=400" alt="">
      </li>
      <li>
        <img src="https://images.unsplash.com/photo-1559181567-c3190ca9959b?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3wzMjM4NDZ8MHwxfHJhbmRvbXx8fHx8fHx8fDE3MzU0NTYzNjF8&ixlib=rb-4.0.3&q=80&w=400" alt="">
      </li>
      <li>
        <img src="https://images.unsplash.com/photo-1618897996318-5a901fa6ca71?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3wzMjM4NDZ8MHwxfHJhbmRvbXx8fHx8fHx8fDE3MzU0NTY0Nzh8&ixlib=rb-4.0.3&q=80&w=400" alt="">

    </ul>
  </div>

  <script src="script.js"></script>
